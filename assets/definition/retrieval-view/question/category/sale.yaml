# 买卖分类对通用提问指南的补充。只增加买卖交易的专业关注点，不复制通用规则。
category_code: sale
category_name: 买卖
purpose: >-
  根据货物或设备所有权转移的交易特点，优先发现会影响交付、验收、价款、风险和售后责任的高价值问题。
selection_rules:
  - 以实际货物交付和价款交换为依据，不因文件标题含有采购、购销或供货就机械生成问题。
  - 分类专项关注点用于深化通用关注点；能够由一个问题完整回答时不得分别生成重复问题。
  - 定制设备同时具有承揽属性时，只保留属于货物所有权转移、交付和买卖责任的内容。
attention_points:
  - code: goods_identity_and_configuration
    name: 货物身份、配置与供货边界
    legal_significance: 货物名称、数量、规格和配置共同确定出卖人应交付的标的物范围。
    practice_significance: 主机、附件、备件、软件许可、包装和随机资料是否包含，常直接影响交付完整性和价格比较。
    applicable_when:
      - 合同涉及一种或多种商品、材料、零部件或设备
    inspect_for:
      - 品名、型号、品牌、数量和单位
      - 标准配置、选配件、备件和耗材
      - 包装、技术资料和随附文件
      - 不在供货范围内的内容
    material_if_missing:
      - 货物无法仅凭名称可靠识别
      - 配置或附件决定设备功能、验收或报价
    excludes:
      - 没有独立交付边界的内部零件说明
      - 与本次供货无关的产品宣传参数
  - code: delivery_ownership_and_risk
    name: 交付、所有权与风险转移
    legal_significance: 交付及所有权、风险转移安排决定货物何时由哪一方控制，并承担毁损灭失后果。
    practice_significance: 运输、卸货、安装地点、签收人与到货单据通常决定交付完成和后续付款起点。
    applicable_when:
      - 合同需要将货物运送、交接或安装到指定地点
    inspect_for:
      - 交货时间、地点、方式和收货主体
      - 运输、包装、装卸和保险费用承担
      - 签收、所有权及风险转移时点
      - 延迟交货、分批交货和提前交货规则
    material_if_missing:
      - 货物在运输或安装期间具有较高毁损灭失风险
      - 交付完成决定付款、验收或质保起算
    excludes:
      - 独立运输合同中的承运服务责任
      - 没有合同依据的默认风险转移结论
  - code: inspection_objection_and_warranty
    name: 检验、异议与售后质量责任
    legal_significance: 检验期限、质量异议和瑕疵补救决定买方如何确认货物符合约定并主张质量责任。
    practice_significance: 到货检验、安装调试、试运行、质保期和维修响应是设备采购中最常见的履约衔接点。
    applicable_when:
      - 货物需要到货检验、功能测试、安装调试或持续质量保证
    inspect_for:
      - 外观、数量、性能和最终验收的区分
      - 检验期限、异议形式和视为合格条件
      - 安装调试、试运行和验收文件
      - 质保起算、维修响应、退换和备件责任
    material_if_missing:
      - 验收结果触发尾款或风险转移
      - 设备故障会影响生产经营或存在较高维修成本
    excludes:
      - 与货物质量无关的一般售前承诺
      - 模型自行补充行业质保期限
  - code: quantity_price_and_payment_linkage
    name: 数量、价格与付款联动
    legal_significance: 数量、单价、总价和付款条件共同决定买方的价款债务。
    practice_significance: 实际交付数量、计量结果、折扣、税票和验收节点经常共同影响最终应付金额。
    applicable_when:
      - 合同存在数量计价、分批供货、阶段付款或结算调整
    inspect_for:
      - 数量与计量确认方式
      - 单价、总价、折扣及调价条件
      - 定金、预付款、到货款、验收款和质保金
      - 发票与付款条件之间的关系
    material_if_missing:
      - 单价和总价存在不一致或计算口径不清
      - 实际数量或验收结果影响最终结算
    excludes:
      - 只罗列价格而不说明与数量或付款的关系
      - 把质保金误认为独立货物价款
