# 所有合同共享的提问选题指南。程序读取本文件后渲染为 Bullet，不把原始 YAML 注入模型。
# name：指南名称；purpose：指南总目标。
# selection_rules：从候选关注点中选择问题的集合级规则。
# question_rules：单个问题的表达规则。
# attention_points：法律通用结构与跨行业履约实践形成的关注点，不是固定问题清单。
name: 合同检索问题通用选题指南
purpose: >-
  从合同法律关系、真实履约过程和用户检索价值出发，选择少量彼此独立的问题，
  使后续答案能够覆盖合同核心交易、关键履行安排、重要风险和具有区分度的特殊约定。
selection_rules:
  - 先判断关注点是否适用于当前合同，再判断合同已经明确约定还是存在具有实质影响的缺失；不适用的事项不得入选。
  - 优先选择会影响合同目的、履行完成、付款结算、权利控制、风险承担或责任救济的事项。
  - 合同已经明确约定的重要事项和依法律关系或行业惯例本应关注但未明确约定的重大事项，都可以形成候选问题。
  - 优先保留当前合同中特殊、异常、带前置条件或明显影响交易结果的安排，避免只复述常见标题。
  - 问题集合应兼顾交易内容、履行过程和风险退出，不要求每个关注点都产生问题。
  - 语义重复或可以由同一紧密主题完整回答的问题应合并，不得为了达到目标数量机械拆分。
  - 没有新的高价值独立事项时应自然结束，不得用无关、重复或低价值事项继续补充。
question_rules:
  - 每个问题只表达一个主要检索意图，但允许包含同一履约机制内不可分割的条件、期限和责任主体。
  - 模拟采购、销售、项目、财务、法务或管理人员查找合同时会真实输入的自然中文，不写成审查清单、字段名称、条款标题或法律教材问题。
  - 在原文能够确认时，优先带上相关方简称、具体产品、服务、项目或交易动作，让问题脱离当前对话仍能识别在问哪一笔交易；不得虚构用户属于合同哪一方。
  - 优先使用“谁需要做什么、什么时候做、满足什么条件、涉及多少”等日常业务表达，避免连续使用“合同约定的……是什么”“具体包括哪些”等僵硬模板。
  - 一个主要意图可以使用一至两个紧密衔接的问句，把同一履约机制下用户真正关心的对象、条件、时间、金额和例外问完整；不得为了简短而删除必要交易背景。
  - 询问合同如何约定以及哪些事实成立，不要求判断条款是否合法、是否公平或应当如何处理纠纷。
  - 问题不得提前写入答案、臆测未出现的事实或把法律常识伪装成合同约定。
  - 不单独询问合同编号、文件页数等已经适合结构化过滤且没有独立语义检索价值的事实。
  - 对适用但未明确约定的重要事项，可以提出问题并由回答阶段如实认定为未明确约定。
attention_points:
  # code：关注点稳定标识；name：面向模型的中文名称。
  # legal_significance / practice_significance：分别说明法律关系与行业履约价值。
  # applicable_when：适用条件；inspect_for：重点检查内容。
  # material_if_missing：即使未约定仍值得提问的条件；excludes：排除边界。
  - code: transaction_relation
    name: 交易关系与合同目的
    legal_significance: 确定各方通过合同建立的核心权利义务交换，是理解其他条款和合同目的的基础。
    practice_significance: 同名合同可能承载买卖、承揽、服务、许可等不同交易，真实合作内容比文件标题更有检索价值。
    applicable_when:
      - 当前文件能够识别出签约主体及至少一项核心给付关系
    inspect_for:
      - 各方在交易中的实际角色
      - 合同要解决的业务事项
      - 各方核心给付与对待给付
      - 框架协议、订单、附件或补充协议之间的关系
    material_if_missing:
      - 文件标题存在但核心交易内容或各方角色不清楚
    excludes:
      - 仅重复合同名称、编号或签署日期
      - 脱离合同事实对交易作最终法律定性
  - code: subject_scope_and_deliverable
    name: 标的、范围与交付成果
    legal_significance: 标的及其范围决定债务人应当完成什么给付，也决定是否实现合同目的。
    practice_significance: 产品配置、服务边界、工程范围、成果清单和附件通常直接影响报价、交付与验收。
    applicable_when:
      - 合同约定货物、设备、工程、服务、权利、资金或其他履行对象
    inspect_for:
      - 标的名称、数量、规格和范围
      - 服务内容、工作成果或交付物
      - 明确纳入或排除的工作边界
      - 技术文件、清单和附件对标的的补充
    material_if_missing:
      - 标的或工作范围无法据合同文本可靠确定
      - 交付成果决定验收、付款或权利归属
    excludes:
      - 与本次交易无关的宣传信息和背景介绍
      - 没有独立交付边界的普通内部步骤
  - code: price_tax_and_settlement
    name: 价款、税费与结算
    legal_significance: 对价及支付条件决定主要金钱债务的内容、期限和履行顺序。
    practice_significance: 固定价、单价计量、里程碑付款、发票条件、扣款和价格调整会直接影响现金流与结算争议。
    applicable_when:
      - 合同存在价款、报酬、租金、利息、服务费或其他经济对价
    inspect_for:
      - 计价方式、金额、币种和含税口径
      - 付款节点、比例、期限和前置条件
      - 发票、对账、结算和扣款机制
      - 价格调整、费用承担和非现金对价
    material_if_missing:
      - 对价存在但金额、算法或支付条件不能确定
      - 付款与交付、验收或其他事件紧密挂钩
    excludes:
      - 只列银行账户而没有付款义务内容
      - 把合同总价、单价和阶段付款混为同一概念
  - code: performance_and_dependencies
    name: 履行安排与协作依赖
    legal_significance: 履行期限、地点、方式以及通知、协助等义务决定各方何时、何地、如何完成债务。
    practice_significance: 资料提供、场地准备、审批确认、人员配合和第三方协作经常构成进度与责任判断的前提。
    applicable_when:
      - 合同存在持续履行、分阶段履行或一方履行依赖另一方配合
    inspect_for:
      - 履行期限、地点、方式和里程碑
      - 前置条件、通知和确认程序
      - 各方配合事项及完成期限
      - 分包、转委托、指定第三方或关键人员要求
    material_if_missing:
      - 履行时间或完成标准影响付款、验收或违约判断
      - 一方必须依赖另一方提供资料、场地、许可或确认
    excludes:
      - 不影响权利义务的普通联系人信息
      - 没有合同依据的项目管理建议
  - code: quality_acceptance_and_warranty
    name: 质量、验收与质量保证
    legal_significance: 质量要求和验收机制决定履行是否符合约定，以及瑕疵出现后的补救责任。
    practice_significance: 检验、测试、试运行、异议期、视为验收和质保服务通常连接交付、付款与风险转移。
    applicable_when:
      - 合同存在可检验的货物、工程、服务成果或其他交付物
    inspect_for:
      - 质量、性能和技术标准
      - 验收主体、方式、期限和文件
      - 异议提出与视为验收规则
      - 返工、补交、退换、维修和质保安排
    material_if_missing:
      - 验收结果决定付款、风险转移或合同完成
      - 合同标的存在持续质量或售后风险
    excludes:
      - 与交付物质量无关的一般通知义务
      - 模型自行设计验收标准
  - code: rights_control_and_protection
    name: 权利归属、使用控制与信息保护
    legal_significance: 所有权、知识产权、数据权益、保密和使用限制决定交易成果可以由谁以何种方式控制和利用。
    practice_significance: 技术成果、软件、品牌、数据、商业秘密和客户资料常是交易价值与后续经营风险的核心。
    applicable_when:
      - 合同涉及成果权利、许可使用、数据处理、保密信息或排他性安排
    inspect_for:
      - 既有权利与新增成果的归属
      - 授权范围、期限、地域和再许可
      - 保密对象、例外、期限和返还销毁
      - 数据用途、访问、留存、跨境和安全控制
    material_if_missing:
      - 交付物包含可复制、可持续使用的成果或敏感信息
      - 权利归属或使用边界会影响合同目的
    excludes:
      - 与当前标的无关的通用权利声明
      - 对知识产权或数据权属作合同外推断
  - code: risk_compliance_and_third_party
    name: 风险负担、合规与第三方责任
    legal_significance: 风险转移、强制性要求及第三方责任会决定意外损失、监管后果和对外责任由谁承担。
    practice_significance: 保险、资质许可、安全环保、第三方侵权和不可抗力安排会显著改变项目成本与履约风险。
    applicable_when:
      - 合同履行涉及标的灭失、监管要求、安全责任、保险或第三方权利
    inspect_for:
      - 风险转移时点和意外损失承担
      - 资质、许可及行业合规义务
      - 安全、环保、保险和事故处理
      - 第三方索赔、侵权担保和赔偿分配
    material_if_missing:
      - 标的或履行活动具有明显人身、财产、数据或监管风险
      - 履行依赖必须具备的资质、许可或保险
    excludes:
      - 对行政或刑事责任作未经合同支持的判断
      - 只因出现“依法”字样就假定存在专项合规安排
  - code: change_assignment_and_exit
    name: 变更、转让、续期与退出
    legal_significance: 变更、权利义务转让、解除和终止规则决定合同关系如何调整或结束，以及终止后的清理责任。
    practice_significance: 需求变化、自动续期、单方退出、交接和数据或材料返还常直接影响业务连续性与沉没成本。
    applicable_when:
      - 合同允许持续履行、阶段调整、续期、转让或提前退出
    inspect_for:
      - 变更形式、审批和价格工期调整
      - 权利义务转让、分包或控制权变化
      - 续期、解除、终止的触发条件和通知期限
      - 终止后的结算、返还、移交及继续有效条款
    material_if_missing:
      - 长期或复杂履行存在现实变更和退出需求
      - 终止后仍需处理费用、成果、资料、数据或保密义务
    excludes:
      - 没有合同依据的退出策略建议
      - 把合同到期与违约解除视为同一情形
  - code: breach_liability_and_remedy
    name: 违约责任与救济
    legal_significance: 违约情形、继续履行、补救、违约金、损失赔偿及责任限制决定不履行后的权利救济。
    practice_significance: 延迟、质量不合格、拒付、泄密和停服等高频事件通常对应不同责任计算和补救路径。
    applicable_when:
      - 合同对不履行、迟延履行或履行不符合约定设置后果
    inspect_for:
      - 具体违约触发条件和责任主体
      - 补救期限、继续履行和替代履行
      - 违约金、赔偿算法、责任上限和免责
      - 损失减轻、索赔通知及证据要求
    material_if_missing:
      - 核心义务存在明显迟延、质量、付款或保密风险
      - 责任上限、免责或排他救济会显著改变风险分配
    excludes:
      - 判断违约金是否过高或免责条款是否有效
      - 脱离合同约定预测诉讼结果
  - code: effectiveness_notice_and_dispute
    name: 生效、文件关系、通知与争议解决
    legal_significance: 生效条件、文件优先顺序、通知送达和争议解决条款决定约定何时约束各方以及如何主张权利。
    practice_significance: 签章、审批、订单与附件冲突、送达地址、管辖或仲裁约定会影响合同执行和争议处理成本。
    applicable_when:
      - 合同存在生效条件、多个组成文件、正式通知程序或争议解决约定
    inspect_for:
      - 签字盖章、审批或其他生效条件
      - 有效期、文件组成和冲突优先顺序
      - 通知方式、送达地址和生效时间
      - 适用法律、协商、仲裁或诉讼安排
    material_if_missing:
      - 多份文件共同构成交易且内容可能冲突
      - 解除、索赔或争议程序依赖正式通知
    excludes:
      - 对合同整体效力作法律结论
      - 仅复述签署页而没有生效或送达意义
  - code: exceptional_contract_arrangement
    name: 合同特有的重要安排
    legal_significance: 非典型但经当事人明确约定的权利义务仍可能直接影响合同目的、履行和责任分配。
    practice_significance: 独家、最低采购、收益分成、回购、对赌、价格联动、服务等级等安排往往最能区分当前合同。
    applicable_when:
      - 合同存在不能被其他通用关注点完整覆盖的实质性特殊机制
    inspect_for:
      - 当前行业特有的交付、计价、运营或风控机制
      - 排他、最低承诺、业绩条件或触发式权利
      - 与通常交易结构不同的特殊例外
    material_if_missing:
      - 该机制会显著改变合同价值、履行路径或退出后果
    excludes:
      - 仅因措辞少见但不影响权利义务的内容
      - 已可由其他关注点完整表达的重复事项
