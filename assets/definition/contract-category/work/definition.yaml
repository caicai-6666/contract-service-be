code: work
name: 承揽
aliases:
  - 加工
  - 定作
  - 定制
  - 修理
  - 检验
meaning: >-
  一方按照另一方的特定要求，运用自身技能、设备或材料完成特定工作成果并交付，另一方验收成果并支付报酬。
core_exchange:
  provider_obligation: 按特定要求完成工作并交付可验收成果
  counterparty_obligation: 提供必要条件、验收工作成果并支付报酬
includes:
  - 加工、定作、修理、复制、测试或检验
  - 以特定成果和验收标准为核心的制作任务
  - 定制设备交易中按确认方案完成并交付可验收成果的制作部分
excludes:
  - 以转移标准商品所有权为核心的买卖
  - 形成建设工程的勘察、设计或施工
  - 仅持续提供活动而没有特定交付成果的一般服务
distinguish_from:
  - category: sale
    rule: >-
      标准商品交付且买方不参与设计制作时通常只命中买卖；仅完成加工、修理等成果且不形成独立所有权转移时只命中承揽；
      定制设备既要求按确认方案完成可验收成果，又明确交付设备、转移所有权并支付设备价款时，承揽与买卖可以同时命中。
  - category: general_service
    rule: 承揽强调可交付和可验收的特定成果，一般服务更强调持续活动或过程履行。
  - category: construction
    rule: 工作对象构成工程建设的勘察、设计或施工时优先归入建设工程。
evidence_hints:
  strong:
    - 明确定作要求、技术标准、工作成果和验收方式
    - 明确承揽人独立完成工作并承担成果质量责任
  insufficient:
    - 合同名称中出现加工或服务
    - 供货合同附带简单安装或调试
    - 仅对标准型号商品约定规格、数量、价款和厂家标准验收
