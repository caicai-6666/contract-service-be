code: employment
name: 劳动与用工
aliases:
  - 劳动合同
  - 聘用
  - 雇佣
  - 用工
meaning: >-
  自然人作为劳动者，在用人主体的组织管理、劳动纪律和工作安排下持续提供劳动，用人主体支付工资报酬并承担相应劳动用工义务。
core_exchange:
  provider_obligation: 劳动者按岗位、工时和管理要求持续提供劳动
  counterparty_obligation: 用人主体安排劳动、支付工资并承担约定用工保障
includes:
  - 劳动合同、聘用合同及具有实质劳动关系的用工安排
  - 以自然人持续从属劳动为核心的雇佣安排
excludes:
  - 企业之间的业务外包、劳务外包或专业服务
  - 自然人独立完成特定成果并自行组织工作的承揽
  - 劳务派遣单位与用工单位之间的服务交易本身
distinguish_from:
  - category: general_service
    rule: 劳动者受用人主体日常管理并取得工资时属于劳动与用工，独立服务方自主管理履约时属于一般服务。
  - category: work
    rule: 以持续劳动过程和组织从属性为核心时属于用工，以独立特定成果为核心时更倾向承揽。
evidence_hints:
  strong:
    - 明确劳动者、用人单位、岗位、工时和工资
    - 明确考勤、规章制度、社会保险或劳动纪律
  insufficient:
    - 合同中出现人员、工时或人工费
    - 企业服务合同要求服务人员遵守现场安全规范
