code: debt_settlement
name: 债务重组与和解
aliases:
  - 债务重组
  - 还款协议
  - 清偿协议
  - 和解协议
  - 债务确认
meaning: >-
  当事人以确认、变更、清偿、抵销或和解既存债务或争议为主要目的，重新安排债务金额、期限、责任或争议终结条件。
core_exchange:
  provider_obligation: 按新约定确认、减免、延期、抵销或接受债务清偿
  counterparty_obligation: 按重组或和解安排履行付款、交付或其他清偿义务
includes:
  - 既存债务确认、分期还款和债务重组
  - 以终结争议或索赔为主要目的的和解
excludes:
  - 买卖、服务等主合同中的普通付款安排
  - 尚无既存债务时首次提供资金的借款
  - 不改变既存权利义务的普通补充协议
distinguish_from:
  - category: loan
    rule: 首次提供资金并约定返还属于借款；围绕既存债务重新确认或安排清偿属于本类。
  - category: sale
    rule: 买卖合同本身的价款条款不构成债务重组，除非文件主要处理已形成的欠款或争议。
  - category: guarantee
    rule: 第三方对他人主债务承担保证责任属于保证，不等同于债权债务双方重组清偿。
evidence_hints:
  strong:
    - 明确引用既存债务、欠款、争议、索赔或生效裁判
    - 明确重组金额、减免、分期、抵销或放弃请求安排
  insufficient:
    - 主合同包含付款期限和违约责任
    - 合同约定发生争议后协商解决
