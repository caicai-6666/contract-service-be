code: intellectual_property
name: 知识产权交易
aliases:
  - 知识产权许可
  - 著作权许可
  - 商标许可
  - 版权转让
meaning: >-
  权利人对商标、著作权及其他非技术型知识产权进行转让、许可或授权，另一方取得约定范围的权利并支付价款、许可费或其他对价。
core_exchange:
  provider_obligation: 在约定地域、期限、用途和方式内转让或许可知识产权
  counterparty_obligation: 按授权范围使用权利并支付价款或许可费用
includes:
  - 商标权、内容著作权、形象或作品的许可和转让
  - 围绕非技术型知识产权形成的独立授权交易
excludes:
  - 专利技术、技术秘密或技术成果的转让和许可
  - 买卖商品时依法附随的有限使用说明
  - 合同中的普通保密或成果归属条款
distinguish_from:
  - category: technology
    rule: 专利技术、技术秘密及技术成果交易优先归入技术；商标和内容著作权等非技术权利归入本类。
  - category: sale
    rule: 购买载体或商品不当然取得其中知识产权，只有权利本身被转让或许可时才选择本类。
evidence_hints:
  strong:
    - 明确权利类型、权利人、授权方式、地域、期限和用途
    - 明确许可费、转让价款和侵权责任
  insufficient:
    - 合同包含一般知识产权归属条款
    - 商品或附件带有商标、图片或软件名称
