code: sale
name: 买卖
aliases:
  - 采购
  - 购销
  - 供货
  - 订购
meaning: >-
  一方交付货物、设备或其他标的物并转移所有权，另一方接收标的物并支付价款的交易。
core_exchange:
  provider_obligation: 交付符合约定的标的物并转移所有权
  counterparty_obligation: 接收、验收标的物并支付价款
includes:
  - 标准商品、原材料、零部件或设备采购
  - 约定数量、单价、交付和验收的供货交易
  - 定制设备交易中可独立识别的设备所有权转移与价款支付部分
excludes:
  - 仅让渡一定期间使用权而不转移所有权
  - 仅完成加工、修理、测试等工作成果并收取报酬，未形成独立的标的物所有权转移与价款支付
  - 仅负责将他人货物运至指定地点
distinguish_from:
  - category: work
    rule: >-
      标准商品交付通常只命中买卖；仅按要求完成加工、修理等成果且不形成独立所有权转移时只命中承揽；
      定制设备既要求按确认方案完成可验收成果，又明确交付设备、转移所有权并支付设备价款时，买卖与承揽可以同时命中。
  - category: lease
    rule: 买卖最终转移所有权，租赁原则上只让渡一定期间的使用收益。
  - category: transport
    rule: 卖方负责送货通常只是买卖的履行方式，不形成独立运输类别。
evidence_hints:
  strong:
    - 明确约定标的物名称、数量、单价或总价
    - 明确约定交付、验收及所有权或风险转移
  insufficient:
    - 标题中单独出现采购、供货或购销
    - 附件中仅出现设备或商品名称
    - 定制合同中只出现买方、卖方、数量和金额，但没有设备交付或所有权转移结构
    - 标的物是否具有既有型号或是否标准化，不能单独决定买卖结构是否成立
