name: 签订日期
code: signing_date
aliases:
  - 合同日期
  - 签约日期
  - 签署日期
  - 合同时间
  - 签订时间
meaning: |
  合同正文明确标注的合同签订或签约日期，保留原文能够确定的完整年月日。
excludes: |
  不包括生效日期、交货日期、付款日期、报价日期、打印日期、附件日期、文件名日期或单方签章日期；正文未填写时不得根据文件名推测。
cardinality: single
properties:
  - name: 签订日期
    code: date
    aliases: []
    type: string
    index_format: strict_date
    required: true
    constraints: {}
    extraction_rule: 提取完整真实签订日期，规范为 YYYY-MM-DD；中文年月日可转换，不补全缺失年月日，不推测日期，不允许不存在的日期。
    meaning: 合同正文明确标注的完整签订或签约日期。
    excludes: 不包括生效、交货、付款、报价、打印、附件或单方签章日期。
