name: 合同编号
code: contract_number
aliases:
  - 合同号
  - 协议编号
  - 合同单号
  - 合约编号
meaning: |
  合同正文明确标注、用于唯一识别当前合同或协议的编号，保留原文中的字母、数字和连接符。
excludes: |
  不包括订单编号、项目编号、产品型号、报价单编号、发票编号或 PDF 文件名中的推测编号；合同未填写编号时不得自行生成。
cardinality: single
properties:
  - name: 合同编号
    code: number
    aliases: []
    type: string
    required: true
    meaning: 合同正文明确标注的唯一识别编号。
    excludes: 不包括订单、项目、产品、报价单或发票编号。
